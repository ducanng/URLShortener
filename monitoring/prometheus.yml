global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: urlshortener
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['urlshortener:7070']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
