# Nginx LB for the urlshortener app — fronts urlshortener-1 and urlshortener-2
# on the shared `urlshortener-net` Docker network. Passive health checks only
# (Nginx OSS); `proxy_next_upstream` makes failed requests transparently retry
# on the other instance so a single dead pod doesn't surface 5xx to clients.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # Buffered access log to cut syscalls under load; flush at most every 5s.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time $upstream_addr';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive between client and nginx — reuse connections, less TCP setup.
    keepalive_timeout 65s;
    keepalive_requests 10000;

    # Edge slow-loris / slow-body defence. Defaults are 60s each, which lets a
    # malicious client hold a worker connection open for a full minute by
    # dribbling headers/body one byte at a time. A URL shortener's requests
    # are tiny, so legitimate clients always complete well within these caps.
    # This is the REAL front-door defence; the Go ReadHeaderTimeout only
    # protects the nginx→app hop.
    client_header_timeout 5s;
    client_body_timeout   10s;

    upstream urlshortener_backend {
        # least_conn balances better than round-robin when request latency
        # varies (e.g. cache hit vs DB fallback).
        least_conn;
        server urlshortener-1:8080 max_fails=3 fail_timeout=10s;
        server urlshortener-2:8080 max_fails=3 fail_timeout=10s;
        # Larger pool + per-conn request reuse drastically cuts upstream
        # connection churn under high RPS.
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;

        # LB-level liveness — does NOT touch upstream. Use this to verify
        # Nginx itself is up.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }

        # Expose the instance that served the request — handy when verifying
        # load distribution from the client side.
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://urlshortener_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Origin $http_origin;


            # Transparent failover: retry on the next upstream when an
            # instance returns a connection-level error or 5xx.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Client-facing bound. Sized above the app's 5s context deadline
            # so the app cancels its own work first and returns a real error;
            # nginx waits up to 10s for that response rather than cutting the
            # upstream prematurely. Invariant: ctx 5s < nginx 10s < Go Write 15s.
            proxy_connect_timeout 2s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }

    # Internal-only stats endpoint for nginx-prometheus-exporter (scraped over
    # urlshortener-net). NOT published to the host — same isolation model as
    # the Go app's :7070 metrics port. Exposes active/reading/writing/waiting
    # connection counts, the direct signal for whether Nginx itself (not the
    # upstream app) is queueing under load.
    server {
        listen 8081;
        server_name _;

        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
