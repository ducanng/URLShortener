basePath: /
definitions:
  main.ErrorResponse:
    properties:
      message:
        example: URL not found
        type: string
    type: object
  main.ShortenRequest:
    properties:
      expires_at:
        example: "2026-12-31T00:00:00Z"
        type: string
      no_expire:
        example: false
        type: boolean
      url:
        example: https://example.com
        type: string
    type: object
  main.ShortenedURL:
    properties:
      clicks:
        example: 0
        type: integer
      expires_at:
        example: "2026-12-31T00:00:00Z"
        type: string
      originalURL:
        example: https://example.com
        type: string
      shortenedURL:
        example: http://localhost:8080/abc123
        type: string
    type: object
  main.URLResponse:
    properties:
      message:
        example: Create short url
        type: string
      status:
        example: Success
        type: string
      url:
        $ref: '#/definitions/main.ShortenedURL'
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a server for URL Shortener API.
  title: URL Shortener API
  version: 1.5.0
paths:
  /{path}:
    get:
      description: Redirect (HTTP 301) to the original URL using the short path
      parameters:
      - description: Short URL path
        example: '"abc123"'
        in: path
        name: path
        required: true
        type: string
      responses:
        "301":
          description: Moved Permanently
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Redirect to original URL
      tags:
      - redirect
  /info/{path}:
    get:
      description: Get info of a shortened URL (original URL, clicks count)
      parameters:
      - description: Short URL path
        example: '"abc123"'
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.URLResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get URL info
      tags:
      - info
  /shorted:
    post:
      consumes:
      - application/json
      description: Create a shortened URL from the original URL via grpc-gateway
      parameters:
      - description: Original URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.ShortenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.URLResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create shortened URL
      tags:
      - shorten
schemes:
- http
- https
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
