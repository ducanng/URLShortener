# Minimal single-binary Loki config for local/dev. Uses boltdb-shipper +
# filesystem storage which works out of the box without extra storage_config
# tuning. Not for production HA — single replica, in-memory ring.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Enables the /loki/api/v1/index/volume endpoint that Grafana's "Logs volume"
  # histogram in Explore queries. Without this, Grafana shows "no logs volume
  # available" above the log panel.
  volume_enabled: true

analytics:
  reporting_enabled: false
