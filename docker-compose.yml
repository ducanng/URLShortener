# Two app instances (urlshortener-1, urlshortener-2) sit behind an Nginx LB
# (service `nginx`, published on :80). App container ports 8080 (HTTP) and
# 7070 (metrics) are NOT exposed to the host — Nginx fronts 8080, and
# Prometheus reaches 7070 over the shared `urlshortener-net` Docker network.
x-app: &app-base
  image: urlshortener
  build:
    context: .
    dockerfile: Dockerfile
  restart: on-failure
  environment:
    - REDIS_ADDR=${REDIS_ADDR}
    - DB=${DB}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    # Optional: unset → relative Swagger host (works everywhere). Set to pin,
    # e.g. localhost:80 behind Nginx. `:-` keeps it empty without a warning.
    - SWAGGER_HOST=${SWAGGER_HOST:-}
    - GOMAXPROCS=3
  depends_on:
    db:
      condition: service_healthy
    redis-db:
      condition: service_started
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  networks:
    - default
    - urlshortener-net

services:
  migrate:
    image: urlshortener
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-migrate
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      - DB=${DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - default
      - urlshortener-net

  urlshortener-1:
    <<: *app-base
    container_name: urlshortener-1
    cpuset: "0-2"
    cpus: 3.0
    mem_limit: 1536m

  urlshortener-2:
    <<: *app-base
    container_name: urlshortener-2
    cpuset: "3-5"
    cpus: 3.0
    mem_limit: 1536m

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    restart: on-failure
    cpuset: "6-7"
    cpus: 2.0
    mem_limit: 512m
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      urlshortener-1:
        condition: service_healthy
      urlshortener-2:
        condition: service_healthy
    networks:
      - default
      - urlshortener-net

  redis-db:
    image: redis:alpine
    cpus: 0.5
    mem_limit: 512m
    ports:
      - "6379:6379"
    container_name: redis-db
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - default
      - urlshortener-net

  db:
    image: postgres:14-alpine
    container_name: postgres14
    cpus: 1.0
    mem_limit: 1g
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=url_shortener
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - urlshortener-net

volumes:
  database-data:
  redis-data:

networks:
  urlshortener-net:
    external: true
